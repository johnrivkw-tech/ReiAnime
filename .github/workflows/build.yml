name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GRADLE_OPTS removed - was causing JVM arg parsing errors

    steps:
      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── JDK 17 ──────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Gradle setup ────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Lint ────────────────────────────────────────────────
      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" 2>&1 | tee lint.log
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      # ── Debug APK ───────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rei-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── Release APK (unsigned unless secrets provided) ──────
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rei-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── Test ────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
 
